# StormCrawler config. crawler-default.yaml from the stormcrawler-core jar is loaded first;
# the keys below override it.
config:
  http.agent.name: "tika-demo"
  http.agent.version: "1.0"
  http.agent.description: "Tika demo, local run against a test web server"
  http.agent.url: "http://localhost/"
  http.agent.email: "test@localhost"

  urlfrontier.host: "localhost"
  urlfrontier.port: 7072
  partition.url.mode: "byHost"

  # All URLs are on one host and wait in the fetcher's queue behind the politeness delay;
  # the timeout covers the whole run so no tuple is replayed and re-fetched.
  topology.max.spout.pending: 10
  topology.message.timeout.secs: 300

  # Maximum bytes fetched per document. /big is served larger than this, everything else is
  # smaller.
  http.content.limit: 3145728

  # Where ParseBytesBolt sends the bytes and where it writes its result lines.
  # parsebytes.target: "localhost:50052"
  # parsebytes.results: "out/results.jsonl"
